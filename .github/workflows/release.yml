# Push a tag like v0.1.1 → build the two outside editors' web builds (figcraft, deckcraft) once,
# then build macOS (Apple Silicon + Intel) and Windows with those builds inside the app, into a
# GitHub Release with the installers, update signatures and latest.json (what installed apps check).
# The release stays a DRAFT until all three builds are done and checked: one job creates it, the
# builds upload into it, and a last job publishes it as Latest. So people never see a half-filled
# release, and "Latest" moves from the old version to the complete new one in one step.
# If a build or the check fails, the draft stays unpublished (users keep the old version);
# use "Re-run all jobs" — the same draft is reused.
#
# Caches: GitHub Actions only lets a run see caches made on its own ref or on the default branch.
# Every tag is its own ref, so tag runs never share caches with each other (checked in v0.3.1:
# every cache was stored under refs/tags/<that tag>, and each release found "Cache not found").
# So pushes to main (and manual runs) only warm the caches (engines + app dependencies, no release),
# and tag runs restore those main-scope caches and do not save new ones.
# A release merges to main and pushes the tag almost at once, so that release's own caches are
# usually not ready yet; they get used from the next release on.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# one run per ref: two runs for the same tag must not each create (or publish) a draft
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Engine sources (public repositories). "main" = whatever is latest when the tag is built.
  # For a reproducible release, pin to a full commit SHA instead, e.g. FIGCRAFT_REF: 1a2b3c4...
  FIGCRAFT_REF: main
  DECKCRAFT_REF: main
  RELEASE_BODY: "Prism 새 버전이에요. 앱을 켜면 자동으로 업데이트 안내가 떠요."

jobs:
  # Builds the web versions of both engines (wasm, OS-independent) once. The three app builds
  # below download the result, so each platform does not compile the engines again.
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: byoungyoon/figcraft
          ref: ${{ env.FIGCRAFT_REF }}
          path: engine-src/figcraft
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: storytold/deckcraft
          ref: ${{ env.DECKCRAFT_REF }}
          path: engine-src/deckcraft
          persist-credentials: false

      # The exact commits we built. They key the engine output cache, so a new commit in an engine
      # repo always rebuilds it.
      - id: sha
        run: |
          echo "figcraft=$(git -C engine-src/figcraft rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "deckcraft=$(git -C engine-src/deckcraft rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # trunk is cached as one binary. Its version is fixed by the key (bump "v1" to update it).
      - id: trunk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-v1

      - uses: cargo-bins/cargo-binstall@main
        if: steps.trunk-cache.outputs.cache-hit != 'true'

      # Prebuilt binary first (seconds); cargo install from source only if that fails.
      - name: Install trunk
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        run: cargo binstall --no-confirm trunk || cargo install --locked trunk

      # Cargo registry and dependency builds. Keyed by Cargo.lock (the default), so a new engine
      # commit that keeps the same dependencies reuses them.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: engine-src/figcraft
          cache-directories: ${{ runner.temp }}/figcraft-target
          cache-on-failure: true
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: engine-src/deckcraft
          cache-directories: ${{ runner.temp }}/deckcraft-target
          cache-on-failure: true
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Finished engine output. A hit skips the build; the key holds the commit and the script.
      - id: figcraft-out
        uses: actions/cache@v4
        with:
          path: public/engines/figcraft
          key: engine-figcraft-${{ steps.sha.outputs.figcraft }}-${{ hashFiles('scripts/build-engine-figcraft.sh') }}

      - name: Build figcraft
        if: steps.figcraft-out.outputs.cache-hit != 'true'
        env:
          FIGCRAFT_DIR: ${{ github.workspace }}/engine-src/figcraft
          CARGO_TARGET_DIR: ${{ runner.temp }}/figcraft-target
        run: scripts/build-engine-figcraft.sh

      - id: deckcraft-out
        uses: actions/cache@v4
        with:
          path: public/engines/deckcraft
          key: engine-deckcraft-${{ steps.sha.outputs.deckcraft }}-${{ hashFiles('scripts/build-engine-deckcraft.sh') }}

      - name: Build deckcraft
        if: steps.deckcraft-out.outputs.cache-hit != 'true'
        env:
          DECKCRAFT_DIR: ${{ github.workspace }}/engine-src/deckcraft
          CARGO_TARGET_DIR: ${{ runner.temp }}/deckcraft-target
        run: scripts/build-engine-deckcraft.sh

      - uses: actions/upload-artifact@v4
        with:
          name: engines
          path: public/engines
          if-no-files-found: error
          retention-days: 1

  # Main pushes / manual runs: fill the main-scope caches for the app build (pnpm store and the Rust
  # dependency build) without making a release. Tag builds below restore them.
  warm-app:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: app-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: src-tauri

  # The one place the release is created. Three builds creating drafts side by side could each make
  # their own (GitHub allows several drafts for one tag).
  draft:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: engines
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      # a tag pushed without a version bump would ship an app that still calls itself the old version
      - name: Check the tag matches the app version
        run: node scripts/check-release.mjs versions "$GITHUB_REF_NAME"

      - id: release
        name: Create (or reuse) the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) \(.draft)\"")
          if grep -q ' false$' <<< "$found"; then
            echo "::error::$GITHUB_REF_NAME is already published. Release a new version instead of rebuilding a live one."
            exit 1
          fi
          id=$(awk 'NR == 1 { print $1 }' <<< "$found")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Prism $GITHUB_REF_NAME" \
              -f body="$RELEASE_BODY" \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [engines, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: app-${{ matrix.target }}
          save-if: false

      - run: pnpm install --frozen-lockfile

      # Engine web builds go into public/engines; vite copies public/ into dist, so the app ships them.
      - uses: actions/download-artifact@v4
        with:
          name: engines
          path: public/engines

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # upload into the draft made above (tagName: so latest.json links use the tag, not the
          # draft's temporary address)
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  # Runs only when all three builds succeeded: check the draft is complete, then publish it.
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [draft, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      # The three builds each add their platform to the same latest.json, so check none got lost.
      - name: Check the installers and latest.json
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          id=$(jq -r '.[] | select(.name == "latest.json") | .id' "$RUNNER_TEMP/assets.json")
          if [ -z "$id" ]; then
            echo "::error::latest.json is missing from the draft. Use 'Re-run all jobs'."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$RUNNER_TEMP/latest.json"
          node scripts/check-release.mjs assets "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/assets.json" "$GITHUB_REPOSITORY"

      # Latest only moves forward: finishing an older tag late must not put the old version back.
      - name: Publish
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || current=""
          make_latest=true
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -n 1)" != "$GITHUB_REF_NAME" ]; then
            make_latest=false
            echo "::warning::$current is newer, so $GITHUB_REF_NAME is published without becoming Latest."
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest="$make_latest" > /dev/null
