<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- warm cream tile, like the app background -->
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FBF7F1"/>
      <stop offset="0.55" stop-color="#F3EADD"/>
      <stop offset="1" stop-color="#E8DAC6"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#F0B070" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#F0B070" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.15" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#BFD4E6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#BFD4E6" stop-opacity="0"/>
    </radialGradient>
    <!-- frosted glass prism -->
    <linearGradient id="glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F6EEE3" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="rayA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A15A"/>
      <stop offset="1" stop-color="#E8A15A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rayN" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B4C7A"/>
      <stop offset="1" stop-color="#3B4C7A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rayS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FB08A"/>
      <stop offset="1" stop-color="#7FB08A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#F6D7B4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C9D7E8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#warm)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#cool)"/>

    <!-- incoming white beam, ending on the left face -->
    <path d="M100 588 L388 528 L392 552 L100 620 Z" fill="#FFFFFF" opacity="0.6" filter="url(#soft)"/>
    <path d="M100 598 L388 534 L390 546 L100 610 Z" fill="url(#beam)"/>

    <!-- three outgoing rays (glow + core) leaving the right face: amber, navy, sage -->
    <g filter="url(#soft)" opacity="0.55">
      <path d="M615 488 L924 362 L924 424 L620 506 Z" fill="#E8A15A"/>
      <path d="M632 526 L924 520 L924 584 L636 542 Z" fill="#3B4C7A"/>
      <path d="M648 564 L924 690 L924 752 L654 580 Z" fill="#7FB08A"/>
    </g>
    <path d="M616 490 L924 374 L924 408 L619 503 Z" fill="url(#rayA)"/>
    <path d="M633 528 L924 532 L924 566 L635 540 Z" fill="url(#rayN)"/>
    <path d="M649 566 L924 702 L924 736 L653 578 Z" fill="url(#rayS)"/>

    <!-- prism shadow -->
    <ellipse cx="512" cy="742" rx="190" ry="26" fill="#7A5A30" opacity="0.22" filter="url(#shadow)"/>

    <!-- glass prism -->
    <path d="M512 262 L716 712 L308 712 Z" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="7" stroke-linejoin="round"/>
    <!-- light fanning out inside the glass -->
    <path d="M390 536 L617 490 L654 578 Z" fill="url(#inner)" opacity="0.75"/>
    <!-- inner facet + highlight edge -->
    <path d="M512 262 L560 712 L716 712 Z" fill="url(#facet)" opacity="0.7"/>
    <path d="M512 290 L340 692" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round"/>
    <path d="M512 262 L716 712 L308 712 Z" fill="none" stroke="#C9B49A" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round"/>

    <!-- top sheen of the tile -->
    <rect x="100" y="100" width="824" height="360" fill="url(#sheen)"/>
  </g>
  <!-- tile edge -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3"/>
</svg>
